services:
  zara-spices:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zara-spices
    restart: unless-stopped
    ports:
      - "3001:3000"        # VPS port 3001 → container 3000
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/products"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
