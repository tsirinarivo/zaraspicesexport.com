services:
  zara-spices:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zara-spices
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"   # loopback only — nginx proxie depuis l'hôte
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/products"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
