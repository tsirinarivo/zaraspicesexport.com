# ─── epice.dago-cloud.com ─────────────────────────────────────────────────────
# Reverse proxy vers le conteneur Docker Zara Spices Export (port 3001)
# Certbot ajoutera automatiquement le bloc SSL après : certbot --nginx -d epice.dago-cloud.com

server {
    listen 80;
    listen [::]:80;
    server_name epice.dago-cloud.com;

    # Certbot gérera la redirection HTTPS automatiquement
    # En attendant le certificat, on sert directement le proxy
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache statique Next.js (_next/static)
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_cache_valid  200 1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
